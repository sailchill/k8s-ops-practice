# EKS 클러스터에 배포하는 ArgoCD Application (자동 Sync + selfHeal)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: practice-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sailchill/k8s-ops-practice.git
    targetRevision: main
    path: k8s/overlays/eks
  destination:
    server: https://kubernetes.default.svc
    namespace: practice
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
